<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PriceLens</title>
    <!-- 内联 favicon（2026-11-01 审计：单文件离线包无 favicon 导致浏览器 404）：
         data URI 自包含，离线单文件/在线版一致，不新增外部资源 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171717'/%3E%3Ctext x='16' y='22' font-family='Inter,-apple-system,system-ui,sans-serif' font-size='17' font-weight='600' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
    <style>
      /* 首屏静态占位：数据模块同步解压期间不再是白屏；React 首次 render 会清空容器自然替换 */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      .boot-ring {
        width: 20px;
        height: 20px;
        border: 2px solid #e8f1ff;
        border-top-color: #0070f3;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-text {
        font-size: 13px;
        /* 第一百八十五轮（外部 UX 审计落地）：#888888 在 #fafafa 底上对比不足
           4.5:1，加深至 #737373（与全局次要文字色一致，约 4.5:1） */
        color: #737373;
        letter-spacing: 0.3px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="正在载入价格数据">
        <div class="boot-ring"></div>
        <div class="boot-text">正在载入价格数据…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
