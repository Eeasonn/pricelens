# PriceLens 在线发布：push main 即自动构建并部署到 GitHub Pages。
# 产物 = pricelens/dist（index.html + assets/ 下分离的 js / css，相对 base './'：GitHub Pages
# 项目子路径 /pricelens/ 与本机服务器根路径都可直接托管；离线单文件已于 2026-11-27 退役）：
# - 根路径 / = 稳定版（npm run build）。2026-11-27 负责人决策：只对稳定版持续迭代，
#   演进版（/iterate/ 子路径）退场，不再构建第二通道。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pricelens/package-lock.json
      - name: Install dependencies
        working-directory: pricelens
        run: npm ci
      - name: Design system contract
        working-directory: pricelens
        run: npm run design:check
      - name: Design system lint
        working-directory: pricelens
        run: npm run design:lint
      - name: Typecheck
        working-directory: pricelens
        run: npm run typecheck
      - name: Tests
        working-directory: pricelens
        run: npm run test -- --run
      - name: Build online version
        working-directory: pricelens
        env:
          # 平台预设 GLM 网关地址（仓库 Settings → Secrets and variables → Actions →
          # Variables 里的 AGENT_GATEWAY_URL）。未配置该变量时此处展开为空串 =
          # 构建不注入预设网关，前端维持纯本地引擎，向后兼容。
          VITE_AGENT_API_BASE_URL: ${{ vars.AGENT_GATEWAY_URL }}
        run: npm run build
      - name: Verify data and contracts
        working-directory: pricelens
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pricelens/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
